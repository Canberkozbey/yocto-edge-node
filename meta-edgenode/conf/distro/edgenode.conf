# Edge node distribution: Poky as the base, our own policy on top.

require conf/distro/poky.conf

DISTRO = "edgenode"
DISTRO_NAME = "Edge Node"
DISTRO_VERSION = "0.1.0"
MAINTAINER = "Canberk Özbey"

INIT_MANAGER = "systemd"

# Headless device: no graphics or audio stack. This keeps Mesa, LLVM and
# friends out of the build. ptest and GObject introspection data add build
# dependencies (the latter runs target binaries under QEMU during the build);
# re-enable ptest when on-target package tests are needed.
DISTRO_FEATURES:remove = "x11 wayland opengl vulkan pulseaudio ptest gobject-introspection-data"
