# Edge node distribution: Poky as the base, our own policy on top.

require conf/distro/poky.conf

DISTRO = "edgenode"
DISTRO_NAME = "Edge Node"
DISTRO_VERSION = "0.1.0"
MAINTAINER = "Canberk Özbey"

INIT_MANAGER = "systemd"

# One log, the journal: no syslog daemon (docs/adr/0003).
# packagegroup-core-boot recommends BusyBox's syslogd, which takes /dev/log
# over from journald, and with it sshd's record of logins.
VIRTUAL-RUNTIME_base-utils-syslog = ""

# Headless device: no graphics or audio stack. This keeps Mesa, LLVM and
# friends out of the build. ptest and GObject introspection data add build
# dependencies (the latter runs target binaries under QEMU during the build);
# re-enable ptest when on-target package tests are needed.
DISTRO_FEATURES:remove = "x11 wayland opengl vulkan pulseaudio ptest gobject-introspection-data"

# No keyboard or local display: drop virtual console setup (keymaps and
# console fonts). It also pulls kbd-keymaps-pine, which is GPLv3.
PACKAGECONFIG:remove:pn-systemd = "vconsole"

# Update signing: the build container sees the build host's key directory
# here, read-only. The keys are never in the repository (docs/updates.md).
EDGENODE_KEYS_DIR ?= "/keys"
