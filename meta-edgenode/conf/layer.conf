BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

# Board-specific recipes and bbappends are parsed only when the board's
# layer is in the build, so this layer stays usable without it.
BBFILES_DYNAMIC += " \
    raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/*/*/*.bb \
    raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "edgenode"
BBFILE_PATTERN_edgenode = "^${LAYERDIR}/"
BBFILE_PRIORITY_edgenode = "10"

# "yocto" is meta-poky, which provides poky.conf for the edgenode distro.
LAYERDEPENDS_edgenode = "core yocto"
LAYERSERIES_COMPAT_edgenode = "wrynose"
