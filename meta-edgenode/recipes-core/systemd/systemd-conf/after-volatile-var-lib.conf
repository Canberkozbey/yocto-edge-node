# On a read-only root, /var/lib is a writable tmpfs only once
# var-volatile-lib.service (volatile-binds) has bound it, before
# local-fs.target. This unit writes to /var/lib but does not wait for
# local-fs.target, so without this it can start first and fail on the
# read-only directory. Where the root is writable, var-volatile-lib.service
# skips itself and this changes nothing.
[Unit]
After=var-volatile-lib.service
