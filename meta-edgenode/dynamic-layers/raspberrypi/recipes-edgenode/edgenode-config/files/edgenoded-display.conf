# Raspberry Pi 5: edgenoded draws on the ST7789 panel (display_connector in
# /etc/edgenoded.conf), so it needs the DRM device nodes. PrivateDevices=
# would hide them; instead the device policy allows DRM devices and, as
# with any closed policy, the basic pseudo devices (/dev/null and the like).
[Service]
PrivateDevices=no
DevicePolicy=closed
DeviceAllow=char-drm rw
SupplementaryGroups=video
