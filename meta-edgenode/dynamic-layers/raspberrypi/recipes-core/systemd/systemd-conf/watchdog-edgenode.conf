# The SoC's hardware watchdog (bcm2835-wdt): systemd keeps it fed, so a hang
# of the kernel or of systemd itself resets the board. 15 s is the
# watchdog's longest timeout. A reset clears the firmware's tryboot flag, so
# a hang during a trial boot also returns to the previous slot (docs/adr/0008).
[Manager]
RuntimeWatchdogSec=15s
# A reboot that hangs on the way down is forced after this long.
RebootWatchdogSec=2min
