# The root filesystem through dm-verity, set up by the kernel itself from
# dm-mod.create= on its command line, before any user space runs: device
# mapper, its early setup and the verity target are built in, as is the
# hash they check blocks with (docs/adr/0009).
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_INIT=y
CONFIG_DM_VERITY=y
CONFIG_CRYPTO_SHA256=y
