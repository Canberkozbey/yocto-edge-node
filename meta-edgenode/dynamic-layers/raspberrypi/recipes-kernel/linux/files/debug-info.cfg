# Debug information (line tables) for the kernel and its modules. The
# package step reads from it which source files each one is built from
# (debugsources), the SBOM lists only those (SPDX_INCLUDE_COMPILED_SOURCES),
# and the CVE check leaves out CVEs in files this kernel does not build
# (kas/cve-check.yml, docs/adr/0010). Without it, every file of the source
# tree counts as built. Only the -dbg packages carry the debug information;
# the Image and the modules in the images are stripped.
# CONFIG_DEBUG_INFO_NONE is not set
CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=y
CONFIG_DEBUG_INFO_REDUCED=y
