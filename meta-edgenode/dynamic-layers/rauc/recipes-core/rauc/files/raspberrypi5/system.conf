# RAUC on the Raspberry Pi 5 edge node: A/B slots on the SD card, chosen by
# the firmware's autoboot.txt and tryboot flag through edgenode-boot
# (docs/adr/0008-ab-updates-with-rauc-and-tryboot.md).
#
#   p1 autoboot  FAT, autoboot.txt only    p4 rootfs.0  ext4, slot A
#   p2 bootfs.0  FAT, slot A               p5 rootfs.1  ext4, slot B
#   p3 bootfs.1  FAT, slot B               p6 data      ext4, /data

[system]
compatible=edgenode-raspberrypi5
bootloader=custom
# Verity bundles only: the payload is checked block by block as it is read
# during installation, not trusted after a one-time check.
bundle-formats=verity
# Survives updates: the data partition, which both slots mount.
data-directory=/data/rauc

[handlers]
bootloader-custom-backend=/usr/bin/edgenode-boot

[keyring]
# The CA certificate that signing certificates must chain to; relative to
# this file's directory.
path=ca.cert.pem
# Signing certificates must be meant for code signing.
check-purpose=codesign
# Without an RTC battery the node can boot with the wrong time; validity is
# checked at the time the bundle was signed instead.
use-bundle-signing-time=true

[slot.rootfs.0]
device=/dev/mmcblk0p4
type=ext4
bootname=A

[slot.bootfs.0]
device=/dev/mmcblk0p2
type=vfat
parent=rootfs.0

[slot.rootfs.1]
device=/dev/mmcblk0p5
type=ext4
bootname=B

[slot.bootfs.1]
device=/dev/mmcblk0p3
type=vfat
parent=rootfs.1
