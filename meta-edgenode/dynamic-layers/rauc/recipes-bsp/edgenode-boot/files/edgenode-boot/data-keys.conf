# Root's SSH keys on the persistent data partition as well as in its home
# (docs/adr/0012). The root filesystem is read-only and the same on every
# node, so the keys of whoever administers a node are provisioned on its
# data partition, like its MQTT identity (docs/provisioning.md).
#
# sshd_config reads this directory before its own settings. A Match block
# ends with its file, and its settings win over the global ones, here over
# sshd_config's AuthorizedKeysFile, for root only: other accounts keep the
# keys in their home.
Match User root
	AuthorizedKeysFile .ssh/authorized_keys /data/ssh/authorized_keys
