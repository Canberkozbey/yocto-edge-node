# edgenoded configuration. Lines are "key = value"; '#' starts a comment.

# Address and TCP port of the HTTP endpoints.
bind = 0.0.0.0
port = 8080

# Analog inputs, read through the kernel's IIO interface and served at
# /sensors: the ADC's sysfs device directory, then one line per input,
# "channel.<name> = <IIO channel index>". Machines with an ADC set these
# (dynamic-layers); without them /sensors lists nothing.
#adc_device = /sys/bus/i2c/devices/1-0048
#channel.example = 0
