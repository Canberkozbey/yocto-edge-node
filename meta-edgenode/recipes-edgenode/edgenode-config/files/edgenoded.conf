# edgenoded configuration. Lines are "key = value"; '#' starts a comment.

# Address and TCP port of the HTTP endpoints.
bind = 0.0.0.0
port = 8080

# Analog inputs, read through the kernel's IIO interface and served at
# /sensors: the ADC's sysfs device directory, then one line per input,
# "channel.<name> = <IIO channel index>". Machines with an ADC set these
# (dynamic-layers); without them /sensors lists nothing.
#adc_device = /sys/bus/i2c/devices/1-0048
#channel.example = 0

# Display: the DRM connector to show the readings on, named as in
# /sys/class/drm (card<N>-<connector>), such as SPI-1. Machines with a
# display set it (dynamic-layers), together with a systemd drop-in that
# lets the service open DRM devices; without it nothing is drawn.
#display_connector = SPI-1

# MQTT: the broker (host name or IPv4 address) to publish the readings to,
# every mqtt_interval seconds, under edgenode/<hostname>/: "sensors" (the
# /sensors JSON, retained) and "status" ("online", or "offline" when the
# daemon stops or its connection drops, retained). MQTT 3.1.1, over TLS
# with mqtt_ca: the CA certificate the broker's certificate must chain to,
# which must also name the broker as written here. mqtt_cert and mqtt_key,
# the node's certificate and key, add mutual TLS. The port defaults to 1883,
# or 8883 with TLS.
#mqtt_broker = broker.example.com
#mqtt_port = 8883
#mqtt_interval = 5
#mqtt_ca = /data/edgenode/mqtt/ca.cert.pem
#mqtt_cert = /data/edgenode/mqtt/node.cert.pem
#mqtt_key = /data/edgenode/mqtt/node.key.pem

# The site's configuration, read after this file, whose settings win: what
# the image cannot know, such as the broker and the node's identity above.
# It lives on the data partition, which updates keep, and only the daemon's
# group can read it (docs/adr/0011). Where it is missing, as on boots
# without the partition, this file alone applies; a file with errors is
# logged and ignored.
site_config = /data/edgenode/edgenoded.conf
