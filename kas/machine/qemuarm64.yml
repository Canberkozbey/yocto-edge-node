# Emulated 64-bit Arm target. Used by CI on every push: builds and boots
# without hardware.

header:
  version: 20

machine: qemuarm64

local_conf_header:
  qemuarm64-console: |
    # qemuarm64.conf also lists hvc0, but runqemu only creates that virtio
    # console in graphical mode. With nographic (CI, tests) the hvc0 getty
    # waits for a device that never appears, boot stays "starting" for 90 s
    # and ends "degraded". The tests use ttyAMA0 and SSH.
    SERIAL_CONSOLES = "115200;ttyAMA0"

  qemuarm64-test-image: |
    # Since wrynose, QEMU machines build ext4.zst. The labgrid tests boot an
    # uncompressed ext4; runqemu also uses it when it is present.
    IMAGE_FSTYPES:append = " ext4"

  qemuarm64-no-gnu-tar: |
    # qemu.inc adds GNU tar (GPLv3) to every image for oe-core's testimage
    # debug archives. The tests here use labgrid, and the production image
    # allows no GPLv3 (docs/adr/0002). oe-core's no-gplv3.inc does the same.
    MACHINE_ESSENTIAL_EXTRA_RDEPENDS:remove = "tar"
