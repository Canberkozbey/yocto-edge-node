# labgrid environment: the development image on the Raspberry Pi 5 in this
# lab, booted from its SD card. labgrid logs in as root on the serial console.
#
# Lab-specific values:
# - the USB serial cable, by the physical USB port it is plugged into, so the
#   name stays the same when other USB serial devices come and go;
# - the address the router reserves for the Pi's MAC address;
# - the smart plug that switches the Pi's power, at its reserved address.
#
# The account running the tests needs access to the serial port (group
# dialout on Ubuntu).

targets:
  main:
    # Hardware attached to this Pi; tests marked lg_feature("...") need it.
    features:
      - ads1115
      - st7789
    # The MQTT broker the tests start on the build host
    # (tests/dev/test_mqtt.py), on its LAN address and a fixed port, which
    # a firewall on the host must let the Pi reach (docs/lab.md).
    options:
      mqtt_broker_listen: 192.168.1.173
      mqtt_broker_from_target: 192.168.1.173
      mqtt_broker_port: 18830
      # Stops the network boot so the Pi boots its SD card (tests/update):
      # the root-owned tool that the sudo rule allows (docs/lab.md).
      netboot_command: sudo -n /usr/local/sbin/edgenode-netboot
    resources:
      RawSerialPort:
        port: /dev/serial/by-path/pci-0000:00:14.0-usb-0:14:1.0-port0
        speed: 115200
      NetworkService:
        address: 192.168.1.164
        username: root
      # The Pi's power supply is plugged into a Shelly Plug M Gen3
      # (S3PL-30110EU), switched over its local HTTP API (Gen2+ API:
      # labgrid's shelly_gen2 backend).
      NetworkPowerPort:
        model: shelly_gen2
        host: http://192.168.1.114
        index: 0
    drivers:
      # Off long enough for the supply's capacitors to drain.
      NetworkPowerDriver:
        delay: 5.0
      SerialDriver: {}
      ShellDriver:
        prompt: 'root@[\w-]+:[^ ]+# '
        login_prompt: ' login: '
        username: root
        login_timeout: 120
      ShellStrategy: {}
