# labgrid environment: the development image in QEMU on the host. labgrid
# logs in as root on the serial console (no password in this image).
#
# LG_IMAGES must point at the build's deploy directory, for example:
#   export LG_IMAGES=~/yocto/work/build/tmp/deploy/images/qemuarm64

targets:
  main:
    # Devices this target has; tests marked lg_feature("...") need them.
    # vkms: the virtual KMS display module in the development image.
    features:
      - vkms
    drivers:
      QEMUDriver:
        qemu_bin: qemu
        machine: virt
        cpu: cortex-a57
        memory: 512M
        extra_args: "-smp 4"
        kernel: kernel
        disk: rootfs
        # Changes go to a temporary overlay; the built image stays untouched.
        disk_opts: "snapshot=on"
        boot_args: "console=ttyAMA0"
        nic: "user,model=virtio-net-pci"
      ShellDriver:
        prompt: 'root@[\w-]+:[^ ]+# '
        login_prompt: ' login: '
        username: root
        # Full emulation of Arm on x86 boots slowly.
        login_timeout: 300
      ShellStrategy: {}

tools:
  qemu: /usr/bin/qemu-system-aarch64

images:
  kernel: !template $LG_IMAGES/Image
  rootfs: !template $LG_IMAGES/edgenode-image-dev-qemuarm64.rootfs.ext4
