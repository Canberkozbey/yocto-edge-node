# Network boot for the lab's Raspberry Pi 5; install as
# /etc/dnsmasq.d/edgenode.conf (docs/lab.md).
#
# Proxy DHCP: the router keeps assigning addresses. dnsmasq only adds the
# boot server to its answers, and only for the Pi's MAC address, then serves
# the boot files over TFTP. No DNS: port 53 belongs to systemd-resolved.

port=0
interface=enp3s0
bind-interfaces

dhcp-range=192.168.1.0,proxy
dhcp-mac=set:edgenode-pi5,98:fe:54:0e:f2:b6
pxe-service=tag:edgenode-pi5,0,"Raspberry Pi Boot"

enable-tftp
tftp-root=/srv/edgenode/tftp

# Each DHCP exchange and TFTP transfer in the journal: journalctl -u dnsmasq
log-dhcp
