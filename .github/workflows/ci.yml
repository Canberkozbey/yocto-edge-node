# Build the images and run the integration tests: in QEMU on every push and
# pull request, then on the lab's Raspberry Pi 5 for pushes and manual runs,
# A/B updates on its SD card included.
#
# Runs on a self-hosted runner: a Yocto build needs more memory and disk
# than GitHub's hosted runners offer, and the runner keeps the download and
# shared state caches between runs, so a typical run takes minutes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One build at a time per branch; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qemuarm64:
    name: Build and test (qemuarm64)
    runs-on: [self-hosted, linux, x64, yocto]
    timeout-minutes: 480
    env:
      KAS_FILES: kas/base.yml:kas/machine/qemuarm64.yml

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up work and cache directories
        run: |
          # Caches are shared with local development builds; the CI build
          # directory is separate so CI never touches a developer's tmp/.
          {
            echo "DL_DIR=${DL_DIR:-$HOME/yocto/cache/downloads}"
            echo "SSTATE_DIR=${SSTATE_DIR:-$HOME/yocto/cache/sstate}"
            echo "KAS_WORK_DIR=$HOME/yocto/ci-work"
          } >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        id: build
        run: |
          mkdir -p "$DL_DIR" "$SSTATE_DIR" "$KAS_WORK_DIR"
          kas-container build "$KAS_FILES"

      - name: Install test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r tests/requirements.txt

      - name: Point the tests at the build output
        run: echo "LG_IMAGES=$KAS_WORK_DIR/build/tmp/deploy/images/qemuarm64" >> "$GITHUB_ENV"

      - name: Tests, development image (QEMU)
        run: |
          .venv/bin/pytest --lg-env tests/env/qemu-dev.yaml tests/dev -v \
            --lg-log=test-logs/dev --junitxml=test-logs/dev.xml

      - name: Tests, production image (contents and QEMU)
        # Runs even when the development tests failed: both results matter.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          .venv/bin/pytest --lg-env tests/env/qemu-prod.yaml tests/image tests/prod -v \
            --lg-log=test-logs/prod --junitxml=test-logs/prod.xml

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-qemuarm64
          path: test-logs/
          if-no-files-found: ignore

  raspberrypi5:
    name: Build and test on hardware (Raspberry Pi 5)
    # The runner's host is the lab's build host: it serves the Pi's network
    # boot and reaches its serial console and smart plug (docs/lab.md).
    runs-on: [self-hosted, linux, x64, yocto]
    needs: qemuarm64
    # Hardware runs only for this repository's own pushes and manual runs,
    # never for pull requests (docs/adr/0005).
    if: github.event_name != 'pull_request'
    timeout-minutes: 480
    # One run at a time owns the Pi, whatever the branch.
    concurrency:
      group: lab-raspberrypi5
      cancel-in-progress: false
    env:
      # With the CVE report (kas/cve-check.yml): the hardware build is the
      # product's.
      KAS_FILES: kas/base.yml:kas/machine/raspberrypi5.yml:kas/cve-check.yml

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up work and cache directories
        run: |
          {
            echo "DL_DIR=${DL_DIR:-$HOME/yocto/cache/downloads}"
            echo "SSTATE_DIR=${SSTATE_DIR:-$HOME/yocto/cache/sstate}"
            echo "KAS_WORK_DIR=$HOME/yocto/ci-work"
            echo "EDGENODE_KEYS=$HOME/yocto/keys"
          } >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check the update signing keys
        # Development keys on the runner's host, outside the repository
        # (docs/updates.md); the build container gets them read-only.
        run: |
          for file in ca.cert.pem signing.cert.pem signing.key.pem; do
            if [ ! -f "$EDGENODE_KEYS/$file" ]; then
              echo "::error::$EDGENODE_KEYS/$file missing; create the keys with tools/make-signing-keys.sh dev (docs/updates.md)"
              exit 1
            fi
          done

      - name: Check the installed network boot tool
        # CI serves images through a root-owned copy of tools/netboot.py, so a
        # change to the repository's copy takes effect only once reinstalled.
        run: |
          cmp -s tools/netboot.py /usr/local/sbin/edgenode-netboot || \
            echo "::warning::/usr/local/sbin/edgenode-netboot differs from tools/netboot.py; reinstall it (docs/lab.md)"

      - name: Build
        id: build
        run: |
          mkdir -p "$DL_DIR" "$SSTATE_DIR" "$KAS_WORK_DIR"
          kas-container --runtime-args "-v $EDGENODE_KEYS:/keys:ro" build "$KAS_FILES"

      - name: Install test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r tests/requirements.txt

      - name: Point the tests at the build output
        run: echo "LG_IMAGES=$KAS_WORK_DIR/build/tmp/deploy/images/raspberrypi5" >> "$GITHUB_ENV"

      - name: Tests, image contents
        env:
          LG_MACHINE: raspberrypi5
          EDGENODE_CVE_CHECK: "1"
        run: |
          EDGENODE_CA_CERT="$EDGENODE_KEYS/ca.cert.pem" .venv/bin/pytest tests/image -v \
            --junitxml=test-logs/pi5-image.xml

      - name: SBOM and CVE report
        # Report only (docs/adr/0010): the summary goes to the run's page,
        # the files to its artifacts.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p sbom
          for image in edgenode-image edgenode-image-dev; do
            stem="$LG_IMAGES/$image-raspberrypi5.rootfs"
            cp -L "$stem.spdx.json" "$stem.sbom-cve-check.yocto.json" "$stem.cve.txt" sbom/
            tools/cve-summary.py "$stem.sbom-cve-check.yocto.json" "CVE report: $image" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload SBOM and CVE report
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-raspberrypi5
          path: sbom/
          if-no-files-found: error

      - name: Tests, development image (hardware)
        # Runs even when the image checks failed, as long as there are images.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          sudo -n /usr/local/sbin/edgenode-netboot deploy edgenode-image-dev --images "$LG_IMAGES"
          .venv/bin/pytest --lg-env tests/env/pi5-dev.yaml tests/dev -v \
            --lg-log=test-logs/pi5-dev --junitxml=test-logs/pi5-dev.xml

      - name: Tests, production image (hardware)
        # Runs even when the development tests failed: both results matter.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          sudo -n /usr/local/sbin/edgenode-netboot deploy edgenode-image --images "$LG_IMAGES"
          .venv/bin/pytest --lg-env tests/env/pi5-prod.yaml tests/prod -v \
            --lg-log=test-logs/pi5-prod --junitxml=test-logs/pi5-prod.xml

      - name: Tests, A/B updates (hardware, SD card)
        # From the development image booted over the network, the tests
        # write the SD card, stop the network boot and boot the card; then
        # update, roll back and cut the power (tests/update). Last, as it
        # leaves the Pi booting from its card.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          sudo -n /usr/local/sbin/edgenode-netboot deploy edgenode-image-dev --images "$LG_IMAGES"
          .venv/bin/pytest --lg-env tests/env/pi5-dev.yaml tests/update -v \
            --lg-log=test-logs/pi5-update --junitxml=test-logs/pi5-update.xml

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-raspberrypi5
          path: test-logs/
          if-no-files-found: ignore
